name: V11.4 Read-only Incident Diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/v114-diagnosis.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const all=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{...context.repo,created:'2026-11-01T23:00:00Z..2026-11-02T22:59:59Z',per_page:100});
            const runs=all.filter(r=>r.path==='.github/workflows/run.yml');
            const report=[];
            for(const r of runs){
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:r.id,per_page:100});
              const row={id:r.id,event:r.event,created_at:r.created_at,run_started_at:r.run_started_at,head_sha:r.head_sha,conclusion:r.conclusion,jobs:[]};
              for(const j of jobs){
                const item={name:j.name,started_at:j.started_at,completed_at:j.completed_at,conclusion:j.conclusion,steps:j.steps.map(s=>({name:s.name,conclusion:s.conclusion}))};
                if(j.conclusion!=='skipped'&&['crypto-bot','v111-analytical-pilot','analysis-delivery-health','pilot-slot'].includes(j.name)){
                  try{
                    const logs=await github.rest.actions.downloadJobLogsForWorkflowRun({...context.repo,job_id:j.id});
                    const text=typeof logs.data==='string'?logs.data:Buffer.from(logs.data).toString('utf8');
                    item.checkout_sha=text.match(/git log -1 --format=%H[\s\S]{0,180}?\b([a-f0-9]{40})\b/)?.[1]||null;
                    item.facts={no_module_v11:text.includes("No module named 'v11'"),native_alert_sent:text.includes('mimoriadny crash alert odoslaný'),main_sent:text.includes('Analytical report delivered'),collection_exceeded:text.includes('Collection exceeded pilot slot'),missing_health:text.includes('ANALYSIS_DELIVERY_HEALTH=MISSING'),telegram_error:text.includes('Telegram refused')||text.includes('Telegram request failed')};
                    item.phase_lines=text.split('\n').filter(l=>l.includes('SCHEDULE_PHASE=')||l.includes('DELIVERY_TIMING ')||l.includes('DELIVERY_RUN ')).filter(l=>!l.includes('print(')).slice(-6);
                    item.errors=[...new Set((text.match(/(?:RuntimeError|ValueError|TypeError|HTTPError|KeyError|TimeoutError|URLError|ModuleNotFoundError|SyntaxError)(?=:)/g)||[]))];
                  }catch(e){item.logs_unavailable=true;}
                }
                row.jobs.push(item);
              }
              report.push(row);
            }
            const result={read_only:true,telegram_sent:false,state_written:false,window_utc:['2026-11-01T23:00:00Z','2026-11-02T22:59:59Z'],runs:report};
            fs.mkdirSync('incident-report');fs.writeFileSync('incident-report/results.json',JSON.stringify(result,null,2));
            for(const r of report)core.notice(JSON.stringify({...r,jobs:r.jobs.map(j=>({name:j.name,conclusion:j.conclusion,started_at:j.started_at,checkout_sha:j.checkout_sha,facts:j.facts,errors:j.errors,steps:j.steps,phase_lines:j.phase_lines}))}));
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const run_id=41512152559;
            const artifacts=(await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id})).data.artifacts;
            const item=artifacts.find(a=>a.name===`v111-analytical-diagnostics-${run_id}`&&!a.expired);
            if(!item||item.size_in_bytes>30000000)throw new Error('Public evidence unavailable');
            const zip=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:item.id,archive_format:'zip'});
            fs.writeFileSync('evidence.zip',Buffer.from(zip.data));
      - shell: python
        run: |
          import zipfile,json
          from pathlib import Path
          with zipfile.ZipFile('evidence.zip') as z:
              files={Path(n).name:n for n in z.namelist()}
              data=json.loads(z.read(files['v112_analysis.json']))
              snap=json.loads(z.read(files['market_snapshot.json']))
          result={'events':data.get('event_notices',{}),'coins':{s:{'price':c.get('price'),'support':c.get('frames',{}).get('4h',{}).get('support')} for s,c in snap['coins'].items()},'snapshot_at':snap['at']}
          Path('incident-report/public-evidence.json').write_text(json.dumps(result))
          print('::notice title=Actual evening event evidence::'+json.dumps(result['events'].get('selected',[])))
      - uses: actions/upload-artifact@v4
        with:
          name: v114-readonly-${{ github.run_id }}
          path: incident-report/
          retention-days: 14
