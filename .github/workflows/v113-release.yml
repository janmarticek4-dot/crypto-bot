name: V11.3 Release Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/v113-release.yml, v11/v113.py, tests/test_v113.py]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      BOT_DISABLE_TELEGRAM: '1'
      TELEGRAM_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      GROQ_API_KEY: ''
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-research.txt
      - run: python scripts/test_integration_offline.py
  apply-explicit-inventory-correction:
    needs: offline
    if: github.event_name == 'push'
    environment: production-advisory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=43,<51'
      - name: Apply owner-declared empty inventory once, preserving declared cash
        env:
          CONFIRM_OWNER_CLOSED_ALL: 'true'
          PROD_STATE_REPOSITORY: ${{ vars.PROD_STATE_REPOSITORY }}
          PROD_STATE_TOKEN: ${{ secrets.PROD_STATE_TOKEN }}
          PROD_STATE_ENCRYPTION_KEY: ${{ secrets.PROD_STATE_ENCRYPTION_KEY }}
        run: |
          python scripts/confirm_empty_inventory.py > /dev/null
          echo '::notice title=Private state correction::Authorized correction verified; no orders, no Telegram, no cash assumption; private details suppressed.'
