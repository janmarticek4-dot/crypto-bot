name: Prediction Research Shadow
on:
  push:
    branches: [main]
    paths:
      - v11/prediction_research.py
      - v11/prediction_journal.py
      - scripts/prediction_research.py
      - tests/test_prediction_research.py
      - requirements-research.txt
      - .github/workflows/prediction-shadow.yml
  schedule:
    - cron: '25 10 * * *'
  workflow_dispatch:
    inputs:
      persist_public_research_journal:
        description: Save ONLY public research forecasts to a separate journal
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: prediction-research-shadow
  cancel-in-progress: false
jobs:
  research:
    # Daily public paper observation explicitly approved on 28 Oct 2026.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BOT_DISABLE_TELEGRAM: '1'
      TELEGRAM_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      GROQ_API_KEY: ''
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1ce162d6d1cd6f91499e3869bce92171bfe9342b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-research.txt
      - run: python scripts/test_integration_offline.py
      - name: Read latest public research input (never production state)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'public-analytics/prediction-shadow.json';
            const response = (await github.rest.repos.getContent({...context.repo,path,ref:'main'})).data;
            const encoded = response.encoding === 'base64' ? response.content :
              (await github.rest.git.getBlob({...context.repo,file_sha:response.sha})).data.content;
            const raw = Buffer.from(encoded,'base64');
            if (raw.length > 16000000) throw new Error('Public research object oversized');
            JSON.parse(raw.toString('utf8'));
            fs.mkdirSync('public-analytics',{recursive:true});
            fs.writeFileSync(path,raw);
      - run: python scripts/prediction_research.py
      - name: Enforce public-only output boundary before upload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v11.state_policy import require_public_data
          from v11.prediction_journal import load
          root=Path('shadow-output/prediction')
          for path in root.glob('*.json'):
              require_public_data(json.loads(path.read_text()))
          load(json.loads((root/'public-predictions.json').read_text()))
          PY
      - name: Publish minimal public audit verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('shadow-output/prediction/diagnostics.json').read_text())
          source=x['source_summary']
          print('::notice title=Prediction research audit::'+json.dumps(dict(version=x['version'],current_sources=source['current'],endpoints=source['endpoints'],independent_validation=False,production_enabled=False,paper_matured=x['paper_matured'],sources=[dict(source=r.get('source'),status=r.get('status'),layer=r.get('error_layer')) for r in json.loads(Path('shadow-output/prediction/source-diagnostics.json').read_text())])))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prediction-research-${{ github.run_id }}
          path: shadow-output/prediction/
          retention-days: 14
  public-journal:
    needs: research
    if: github.ref == 'refs/heads/main' && (inputs.persist_public_research_journal || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prediction-research-${{ github.run_id }}
          path: research
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('research/public-predictions.json', 'utf8'));
            if (data.schema !== 'prediction-research-journal-v2' || !Array.isArray(data.predictions) || data.predictions.length > 600 || !Array.isArray(data.input_vintages) || data.input_vintages.length > 10000) throw new Error('Invalid journal');
            const allowed = new Set(['id','symbol','created','due','price','point','low','high','direction','continuation','result','model_version','model','source_digest','btc_digest','requested_hours','tolerance_log','source_cutoff','source_close','source_mode','inputs']);
            for (const row of data.predictions) {
              if (Object.keys(row).some(k => !allowed.has(k))) throw new Error('Unexpected field');
              if (!['SOL','TAO','FET','AAVE','ONDO','RENDER'].includes(row.symbol)) throw new Error('Unexpected symbol');
            }
            const path = 'public-analytics/prediction-shadow.json';
            let sha, previous = null;
            const crypto = require('crypto');
            const expected = JSON.parse(fs.readFileSync('research/journal-manifest.json','utf8')).previous_sha256;
            try {
              const response = (await github.rest.repos.getContent({...context.repo,path,ref:'main'})).data;
              sha = response.sha;
              const encoded = response.encoding === 'base64' ? response.content :
                (await github.rest.git.getBlob({...context.repo,file_sha:response.sha})).data.content;
              previous = crypto.createHash('sha256').update(Buffer.from(encoded,'base64')).digest('hex');
            }
            catch (e) { if (e.status !== 404) throw e; }
            if (previous !== expected) throw new Error('Concurrent journal change refused');
            await github.rest.repos.createOrUpdateFileContents({...context.repo,path,branch:'main',sha,
              message:'Update public prediction research journal [skip ci]',
              content:Buffer.from(JSON.stringify(data,null,2)+'\n').toString('base64')});
