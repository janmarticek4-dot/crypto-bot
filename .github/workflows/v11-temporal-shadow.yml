name: V11.1 Temporal Shadow
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Voliteľný pevný commit vývojového zdroja (prázdne = tento commit)
        type: string
        default: ''
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: v111-temporal-shadow-${{ github.repository }}
  cancel-in-progress: false
jobs:
  observe:
    if: (github.repository == 'janmarticek4-dot/crypto-bot' && github.ref == 'refs/heads/feature/v11-1-review') || (github.repository != 'janmarticek4-dot/crypto-bot' && vars.SHADOW_RESEARCH_ONLY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_DISABLE_TELEGRAM: '1'
      BOT_DATA_MODE: shadow
      V11_RULES_VALIDATED: 'false'
      TELEGRAM_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      GROQ_API_KEY: ''
      SHADOW_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      SHADOW_SOURCE_BRANCH: feature/v11-1-review
    steps:
      - name: Validate immutable source pin
        run: |
          if ! [[ "$SHADOW_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then exit 1; fi
      - uses: actions/checkout@v4
        with:
          repository: janmarticek4-dot/crypto-bot
          ref: ${{ env.SHADOW_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Bratislava slot using real IANA timezone
        id: slot
        run: python scripts/temporal_shadow.py --slot >> "$GITHUB_OUTPUT"
      - name: Find only successful same-day same-source observations
        if: steps.slot.outputs.phase != ''
        id: reference
        uses: actions/github-script@v7
        env:
          DAY: ${{ steps.slot.outputs.day }}
          PHASE: ${{ steps.slot.outputs.phase }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const prefix = `v111-temporal-`;
            const suffix = `-${process.env.DAY}-${process.env.SHADOW_SOURCE_SHA}`;
            const phaseName = prefix + process.env.PHASE + suffix;
            const morningName = prefix + 'morning' + suffix;
            let prior = false, morning = null;
            const workflow = process.env.CALLER_WORKFLOW_REF.split('/.github/workflows/')[1]?.split('@')[0];
            if (!['run.yml','v11-temporal-shadow.yml','shadow-temporal.yml'].includes(workflow)) throw new Error('Unknown caller workflow; provenance lookup refused');
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: workflow, branch: context.ref.replace('refs/heads/',''),
              status: 'success', created: `>=${process.env.DAY}`, per_page: 100
            });
            for (const run of runs) {
              if (String(run.id) === String(context.runId) || !['schedule','workflow_dispatch'].includes(run.event)) continue;
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id:run.id});
              const artifacts = data.artifacts.filter(a => !a.expired);
              if (artifacts.some(a=>a.name===phaseName)) prior = true;
              if (!morning && artifacts.some(a=>a.name===morningName)) morning = run.id;
            }
            core.setOutput('skip',prior ? 'true':'false');
            core.setOutput('morning',morning || '');
            core.setOutput('morning_artifact',morningName);
            core.setOutput('artifact',phaseName);
      - uses: actions/download-artifact@v4
        if: steps.slot.outputs.phase == 'evening' && steps.reference.outputs.skip != 'true' && steps.reference.outputs.morning != ''
        with:
          name: ${{ steps.reference.outputs.morning_artifact }}
          run-id: ${{ steps.reference.outputs.morning }}
          github-token: ${{ github.token }}
          path: shadow-output/temporal-reference
      - name: Install and test isolated source
        env:
          SHADOW_SOURCE_SHA: ''
          SHADOW_SOURCE_BRANCH: ''
        if: steps.slot.outputs.phase != '' && steps.reference.outputs.skip != 'true'
        run: |
          python -m pip install -r requirements.txt
          python scripts/test_offline.py
      - name: Collect genuinely new market and fundamental observations
        if: steps.slot.outputs.phase != '' && steps.reference.outputs.skip != 'true'
        env:
          PHASE: ${{ steps.slot.outputs.phase }}
        run: python scripts/temporal_shadow.py --phase "$PHASE" --reference shadow-output/temporal-reference/checkpoints/morning.json
      - name: Privacy validation
        if: always() && steps.slot.outputs.phase != '' && steps.reference.outputs.skip != 'true'
        run: python scripts/stage_shadow_artifacts.py --source shadow-output/temporal-current --destination shadow-public-artifacts/temporal-current
      - uses: actions/upload-artifact@v4
        if: always() && steps.reference.outputs.artifact != '' && steps.reference.outputs.skip != 'true'
        with:
          name: ${{ steps.reference.outputs.artifact }}
          path: shadow-public-artifacts/temporal-current/
          retention-days: 14
          if-no-files-found: error
      - name: Summary
        if: always()
        env:
          PHASE: ${{ steps.slot.outputs.phase }}
          ALREADY_DONE: ${{ steps.reference.outputs.skip }}
        run: |
          echo "Bratislava phase: ${PHASE:-outside window}; already collected: ${ALREADY_DONE:-false}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f shadow-public-artifacts/temporal-current/comparison.txt ]; then
            cat shadow-public-artifacts/temporal-current/comparison.txt >> "$GITHUB_STEP_SUMMARY"
          fi
