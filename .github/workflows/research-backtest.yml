name: Research backtests only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-backtest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r backtesting/requirements.txt
      - name: Test research logic
        run: python -m unittest discover -s research/phase3 -p 'test_*.py' -v
      - name: Backtests (no trading command)
        run: bash backtesting/run.sh
      - name: Single-asset validation
        if: ${{ !cancelled() }}
        run: python backtesting/single_coin.py
      - name: Record reproducibility manifest
        if: always()
        run: |
          mkdir -p backtesting/user_data
          git rev-parse HEAD > backtesting/user_data/commit.txt
          python -m pip freeze > backtesting/user_data/dependencies.txt
          find backtesting/user_data/data -type f -exec sha256sum {} + > backtesting/user_data/data-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-results-${{ github.run_id }}
          path: |
            backtesting/user_data/backtest_results/
            backtesting/user_data/*-*.json
            backtesting/user_data/*.txt
            docs/BACKTEST_RESULTS.*
            docs/v11.1/SINGLE_COIN.md
            docs/v11.1/single_coin_results.json
            backtesting/user_data/v111-single/
