# Research-branch override of the already-registered run.yml path.
# Original main remains untouched; this branch NEVER runs production or Telegram.
name: Macro Sources Diagnostics — development branch entrypoint
on:
  workflow_dispatch:
    inputs:
      task:
        description: Izolovaná diagnostika alebo V11.1 shadow test
        type: choice
        options: [macro, shadow, private-state]
        default: macro
      confirm_private_state_test:
        description: Potvrdzujem iba syntetické zápisy do osobitného testovacieho PRIVATE repozitára
        type: boolean
        default: false
      phase:
        description: Shadow fáza; morning 07:00–08:30, evening 20:00–21:30 Bratislava
        type: choice
        options: [preview, morning, evening]
        default: preview
      morning_run_id:
        description: ID ranného behu; prázdne = bezpečné automatické vyhľadanie
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: macro-sources-diagnostics-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostics:
    # Original repo: research branch only. A clean diagnostics-only research repo
    # can use its own default branch, without changing original main at all.
    if: github.ref == 'refs/heads/feature/v11-1-review' && inputs.task != 'shadow' && inputs.task != 'private-state'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check standalone script syntax (no bot/dependency install)
        run: python -m py_compile scripts/macro_source_diagnostics.py
      - name: Public HTTPS and data-format diagnostics
        run: |
          python scripts/macro_source_diagnostics.py
          python scripts/macro_calendar_diagnostics.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-sources-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: macro-diagnostics-output/
          retention-days: 7
          if-no-files-found: warn
      - name: Publish run summary
        if: always()
        run: |
          if [ -f macro-diagnostics-output/REPORT.md ]; then
            cat macro-diagnostics-output/REPORT.md >> "$GITHUB_STEP_SUMMARY"
            if [ -f macro-diagnostics-output/CALENDAR.md ]; then
              cat macro-diagnostics-output/CALENDAR.md >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'Diagnostics did not produce a report; inspect job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

  shadow:
    if: github.ref == 'refs/heads/feature/v11-1-review' && inputs.task == 'shadow'
    uses: ./.github/workflows/v11-1-shadow-test.yml
    with:
      phase: ${{ inputs.phase || 'preview' }}
      morning_run_id: ${{ inputs.morning_run_id || '' }}
      use_groq: false

  private-state:
    if: github.ref == 'refs/heads/feature/v11-1-review' && inputs.task == 'private-state'
    uses: ./.github/workflows/private-state-integration.yml
    with:
      confirm_synthetic_writes: ${{ inputs.confirm_private_state_test || false }}
