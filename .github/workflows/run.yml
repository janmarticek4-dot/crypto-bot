name: Crypto AI Bot V11.2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/run.yml']
  schedule:
    - cron: "*/15 * * * *"
    - cron: "2 5,6,13,14,18,19 * * *"
  workflow_dispatch:
    inputs:
      recover_due_analysis:
        description: "Bezpečne doplniť chýbajúcu plánovanú analýzu (rovnaký slot, nie nový ručný report)"
        type: boolean
        default: false
      portfolio_commands:
        description: "Spracovať príkazy portfólia (bez analýzy a bez obchodov)"
        type: boolean
        default: false
      advisory_import:
        description: Inicializovať iba používateľom zadanú súkromnú evidenciu z Environment Secretu?
        type: boolean
        default: false
      manual_v111_analysis:
        description: "Ručná analýza V11.2 — aktuálny report s experimentálnym V2"
        required: false
        default: false
        type: boolean
      manual_analysis:
        description: "Staršia ručná analýza V10.6 (nezaškrtávať pre V11.1)"
        required: false
        default: false
        type: boolean
      manual_deep_search:
        description: "Pri ručnej analýze spustiť aj hlboké vyhľadávanie?"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: crypto-ai-bot
  cancel-in-progress: false

jobs:
  validate-manual-v111:
    if: github.event_name == 'workflow_dispatch' && inputs.manual_v111_analysis == true
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require approved V11.1 and one explicit manual action
        env:
          ENABLED: ${{ vars.V111_INTEGRATION_ENABLED || 'false' }}
          RECOVERY: ${{ inputs.recover_due_analysis || false }}
          PORTFOLIO: ${{ inputs.portfolio_commands || false }}
          IMPORT: ${{ inputs.advisory_import || false }}
          LEGACY: ${{ inputs.manual_analysis || false }}
          DEEP: ${{ inputs.manual_deep_search || false }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main' || { echo 'Vyberte vetvu main.'; exit 1; }
          test "$ENABLED" = 'true' || { echo 'Schválená integrácia V11.1 nie je zapnutá.'; exit 1; }
          test "$RECOVERY:$PORTFOLIO:$IMPORT:$LEGACY:$DEEP" = 'false:false:false:false:false' || { echo 'Pre ručnú V11.1 ponechajte ostatné ručné možnosti vypnuté.'; exit 1; }
  crypto-bot:
    if: github.event_name != 'push' && inputs.advisory_import != true && inputs.manual_v111_analysis != true && inputs.portfolio_commands != true && inputs.recover_due_analysis != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout approved monitor code separately from current production state
        uses: actions/checkout@v4
        with:
          ref: 5e78b4cf284775debb0d3b8fd4e3c6319ce9f634
          path: approved-native-runtime
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Crypto AI Bot
        env:
          GH_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          MANUAL_ANALYSIS: ${{ inputs.manual_analysis || false }}
          MANUAL_DEEP_SEARCH: ${{ inputs.manual_deep_search || false }}
          PYTHONUNBUFFERED: "1"
          V111_TRIAL_ENABLED: ${{ vars.V111_TRIAL_ENABLED || 'true' }}
        run: |
          python scripts/state_public_guard.py --record-schema "$RUNNER_TEMP/v111-state-schema.json"
          echo "::notice title=Approved safety monitor source::$(git -C approved-native-runtime rev-parse HEAD)"
          python approved-native-runtime/scripts/native_presentation.py
      - name: Save bot state
        if: always() && !cancelled()
        run: |
          if [ -f bot_state.json ]; then
            python scripts/state_public_guard.py --require-schema "$RUNNER_TEMP/v111-state-schema.json"
            git config user.name "crypto-ai-bot"
            git config user.email "crypto-ai-bot@users.noreply.github.com"
            git add bot_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update crypto bot state [skip ci]"
              git pull --rebase --autostash
              git push
            else
              echo "Stav bota sa nezmenil."
            fi
          else
            echo "bot_state.json neexistuje - nič sa neukladá."
          fi

  pilot-slot:
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.recover_due_analysis == true && inputs.manual_v111_analysis != true && inputs.portfolio_commands != true && inputs.advisory_import != true)) && vars.V111_TRIAL_ENABLED != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      phase: ${{ steps.slot.outputs.phase }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5e78b4cf284775debb0d3b8fd4e3c6319ce9f634
          persist-credentials: false
      - id: slot
        shell: python
        run: |
          import os
          from datetime import datetime,timezone
          from v11.production_schedule import phase as select_phase
          phase = select_phase(datetime.now(timezone.utc)) or ''
          print('SCHEDULE_PHASE='+(phase or 'none'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('phase=' + phase + '\n')
  v111-analytical-pilot:
    environment: production-advisory
    needs: [crypto-bot, pilot-slot, private-advisory-updates, validate-manual-v111]
    if: always() && ((needs.pilot-slot.outputs.phase != '' && needs.crypto-bot.result != 'cancelled' && vars.V111_TRIAL_ENABLED != 'false') || (github.event_name == 'workflow_dispatch' && inputs.manual_v111_analysis == true && needs.validate-manual-v111.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # User-approved immutable release, 28 Oct 2026; legacy V112_APPROVED_SOURCE retained only for rollback.
      - name: Checkout reviewed immutable analytical pilot source
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.V112_ANALYTICS_ENABLED == 'true' && vars.V111_INTEGRATION_ENABLED == 'true' && '5e78b4cf284775debb0d3b8fd4e3c6319ce9f634' || vars.V111_INTEGRATION_ENABLED == 'true' && 'c012eca0fe8967220025deb60d431d7621f40485' || '929bd6389216be1b4eefcd1be61be89d944abf33' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing analytical dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline regression with delivery disabled
        run: |
          if [ "${{ vars.V111_INTEGRATION_ENABLED }}" = 'true' ]; then
            python scripts/test_integration_offline.py
          else
            python scripts/test_offline.py
          fi
      - name: Send analytical advice (private inventory only when configured)
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          V11_RULES_VALIDATED: 'false'
          V111_INTEGRATION_ENABLED: ${{ vars.V111_INTEGRATION_ENABLED || 'false' }}
          V111_DIAGNOSTICS_DIR: analytical-diagnostics
          V112_ANALYTICS_ENABLED: ${{ vars.V112_ANALYTICS_ENABLED == 'true' && vars.V111_INTEGRATION_ENABLED == 'true' }}
          V2_REPORT_ENABLED: ${{ vars.V112_ANALYTICS_ENABLED == 'true' && vars.V111_INTEGRATION_ENABLED == 'true' }}
          OPENBLAS_NUM_THREADS: '1'
          V111_MANUAL_ANALYSIS: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_v111_analysis == true }}
          PRIVATE_ADVISORY_ENABLED: ${{ vars.PROD_STATE_REPOSITORY != '' && secrets.PROD_STATE_TOKEN != '' && secrets.PROD_STATE_ENCRYPTION_KEY != '' }}
          PROD_STATE_REPOSITORY: ${{ vars.PROD_STATE_REPOSITORY }}
          PROD_STATE_TOKEN: ${{ secrets.PROD_STATE_TOKEN }}
          PROD_STATE_ENCRYPTION_KEY: ${{ secrets.PROD_STATE_ENCRYPTION_KEY }}
        run: |
          if [ "$V111_INTEGRATION_ENABLED" = 'true' ]; then
            python scripts/v111_integrated_delivery.py
          else
            python scripts/v111_trial.py
          fi
      - name: Public analytical diagnostics only (no private attachment)
        if: always() && vars.V111_INTEGRATION_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v111-analytical-diagnostics-${{ github.run_id }}
          path: |
            analytical-diagnostics/analysis_details.txt
            analytical-diagnostics/risk_diagnostics.json
            analytical-diagnostics/fundamental_evidence.json
            analytical-diagnostics/market_snapshot.json
            analytical-diagnostics/v112_analysis.json
          if-no-files-found: ignore
          retention-days: 7

  us-source-validation:
    environment: production-advisory
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 929bd6389216be1b4eefcd1be61be89d944abf33
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Live public US and fundamentals source validation (no Telegram)
        run: python scripts/check_us_live_sources.py
      - name: Verify actual approved analytical checkout without delivery
        uses: actions/checkout@v4
        with:
          path: verified-release
          ref: ${{ vars.V112_ANALYTICS_ENABLED == 'true' && vars.V111_INTEGRATION_ENABLED == 'true' && '5e78b4cf284775debb0d3b8fd4e3c6319ce9f634' || vars.V111_INTEGRATION_ENABLED == 'true' && 'c012eca0fe8967220025deb60d431d7621f40485' || '929bd6389216be1b4eefcd1be61be89d944abf33' }}
          persist-credentials: false
      - name: Record effective production source (no Telegram)
        env:
          V112_ACTIVE: ${{ vars.V112_ANALYTICS_ENABLED == 'true' && vars.V111_INTEGRATION_ENABLED == 'true' }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          source=subprocess.check_output(['git','-C','verified-release','rev-parse','HEAD'],text=True).strip()
          value=dict(source=source,v112_active=os.getenv('V112_ACTIVE')=='true',experimental_display=True,telegram_sent=False)
          Path('us-source-diagnostics/deployment.json').write_text(json.dumps(value))
          print('::notice title=Verified production V2 source::'+json.dumps(value))
          assert value['v112_active'] and source=='5e78b4cf284775debb0d3b8fd4e3c6319ce9f634','Existing V11.2 flags must be enabled; production source was not activated'
          PY
      - name: Verify existing private advisory context read-only (no values or Telegram)
        working-directory: verified-release
        env:
          BOT_DISABLE_TELEGRAM: '1'
          CONFIGURED: ${{ vars.PROD_STATE_REPOSITORY != '' && secrets.PROD_STATE_TOKEN != '' && secrets.PROD_STATE_ENCRYPTION_KEY != '' }}
          PROD_STATE_REPOSITORY: ${{ vars.PROD_STATE_REPOSITORY }}
          PROD_STATE_TOKEN: ${{ secrets.PROD_STATE_TOKEN }}
          PROD_STATE_ENCRYPTION_KEY: ${{ secrets.PROD_STATE_ENCRYPTION_KEY }}
        run: |
          python - <<'PYREAD'
          import json,os
          value=dict(configured=os.getenv('CONFIGURED')=='true',read_verified=False,telegram_sent=False,state_written=False)
          if value['configured']:
              try:
                  from v11.advisory_portfolio import load
                  load()  # Existing read/validation only; never log decrypted values.
                  value['read_verified']=True
              except Exception as exc:
                  value['error']=type(exc).__name__
          print('::notice title=Private advisory read-only verification::'+json.dumps(value))
          if not value['read_verified']:raise SystemExit('Private context unavailable; no state or Secrets were modified')
          PYREAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-source-validation-${{ github.run_id }}
          path: |
            us-source-diagnostics/report.json
            us-source-diagnostics/deployment.json
          retention-days: 7
          if-no-files-found: warn

  private-advisory-updates:
    if: github.ref == 'refs/heads/main' && vars.PRIVATE_INVENTORY_COMMANDS_ENABLED != 'false' && ((github.event_name == 'schedule' && vars.V111_TRIAL_ENABLED != 'false') || (github.event_name == 'workflow_dispatch' && inputs.portfolio_commands == true && inputs.manual_v111_analysis != true && inputs.manual_analysis != true && inputs.advisory_import != true))
    environment: production-advisory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5e78b4cf284775debb0d3b8fd4e3c6319ce9f634
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=43,<51'
      - name: Verify approved private-command source
        run: test "$(git rev-parse HEAD)" = "5e78b4cf284775debb0d3b8fd4e3c6319ce9f634"
      - name: Owner enrollment gate (no Telegram or state access)
        id: owner
        env:
          OWNER: ${{ secrets.ADVISORY_TELEGRAM_USER_ID || vars.ADVISORY_TELEGRAM_USER_ID }}
        run: |
          if [ -n "$OWNER" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo '::notice title=Portfolio commands inactive::Set ADVISORY_TELEGRAM_USER_ID in production-advisory. No updates consumed, no private state changes.'
          fi
      - name: Record owner-declared inventory only (no market orders)
        if: steps.owner.outputs.ready == 'true'
        env:
          PROD_STATE_REPOSITORY: ${{ vars.PROD_STATE_REPOSITORY }}
          PROD_STATE_TOKEN: ${{ secrets.PROD_STATE_TOKEN }}
          PROD_STATE_ENCRYPTION_KEY: ${{ secrets.PROD_STATE_ENCRYPTION_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADVISORY_TELEGRAM_USER_ID: ${{ secrets.ADVISORY_TELEGRAM_USER_ID || vars.ADVISORY_TELEGRAM_USER_ID }}
        run: python scripts/private_advisory_updates.py

  initialize-private-advisory:
    if: github.event_name == 'workflow_dispatch' && inputs.advisory_import == true && inputs.manual_v111_analysis != true && inputs.portfolio_commands != true
    environment: production-advisory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 929bd6389216be1b4eefcd1be61be89d944abf33
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-state-integration.txt
      - name: Initialize declared inventory, refuse existing state
        env:
          CONFIRM_PRIVATE_IMPORT: 'true'
          PROD_STATE_REPOSITORY: ${{ vars.PROD_STATE_REPOSITORY }}
          PROD_STATE_TOKEN: ${{ secrets.PROD_STATE_TOKEN }}
          PROD_STATE_ENCRYPTION_KEY: ${{ secrets.PROD_STATE_ENCRYPTION_KEY }}
          INITIAL_ADVISORY_PORTFOLIO: ${{ secrets.INITIAL_ADVISORY_PORTFOLIO }}
        run: python scripts/initialize_private_advisory.py

  analysis-delivery-health:
    needs: [v111-analytical-pilot]
    if: always() && github.event_name == 'schedule' && vars.V111_TRIAL_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5e78b4cf284775debb0d3b8fd4e3c6319ce9f634
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check sent/uncertain/missing without Telegram or private secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_analysis_delivery.py
