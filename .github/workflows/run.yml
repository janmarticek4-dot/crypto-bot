
name: Crypto AI Bot V8.0

on:
  # Bezpecnostna kontrola kazdych 15 minut.
  schedule:
    - cron: "*/15 * * * *"

  # Rucne spustenie cez GitHub Actions.
  workflow_dispatch:
    inputs:
      manual_analysis:
        description: "Spustit okamzitu hlavnu analyzu?"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: crypto-ai-bot
  cancel-in-progress: false

jobs:
  crypto-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai

      - name: Run Crypto AI Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          MANUAL_ANALYSIS: ${{ inputs.manual_analysis || false }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py

      - name: Save bot state
        if: always() && !cancelled()
        run: |
          if [ -f bot_state.json ]; then
            git config user.name "crypto-ai-bot"
            git config user.email "crypto-ai-bot@users.noreply.github.com"
            git add bot_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update crypto bot state"
              git push
            else
              echo "Stav bota sa nezmenil."
            fi
          else
            echo "bot_state.json neexistuje."
          fi
