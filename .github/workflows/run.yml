name: Fetch Crypto Index

on:
  schedule:
    - cron: '0 * * * *' # Spustí sa automaticky každú hodinu
  workflow_dispatch: # Umožní ti to spustiť skript kedykoľvek aj ručne

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run script
        run: python main.py
