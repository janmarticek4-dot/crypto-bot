name: V11.1 Analytical Release Review
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_DISABLE_TELEGRAM: '1'
      TELEGRAM_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      GROQ_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/test_integration_offline.py
