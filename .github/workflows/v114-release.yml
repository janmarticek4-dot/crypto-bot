name: V11.4 Release Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/v114-release.yml, v11/news_incidents.py, v11/support_scenarios.py, tests/test_v114.py]
concurrency:
  group: v114-readonly-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      BOT_DISABLE_TELEGRAM: '1'
      TELEGRAM_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      GROQ_API_KEY: ''
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-research.txt
      - run: python scripts/test_integration_offline.py
