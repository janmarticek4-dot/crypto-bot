name: V11.1 Shadow Test
on:
  workflow_call:
    inputs:
      phase:
        type: string
        default: preview
      morning_run_id:
        type: string
        default: ''
      use_groq:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      phase:
        description: preview alebo skutočný ranný/večerný test (07:00–08:30 / 20:00–21:30 Bratislava)
        type: choice
        options: [preview, morning, evening]
        default: preview
      morning_run_id:
        description: Voliteľné ID morning behu; prázdne = automatické vyhľadanie na rovnakom commite
        type: string
        default: ''
      use_groq:
        description: Voliteľne overiť Groq (bez kľúča sa použije deterministický fallback)
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: v111-shadow-test
  cancel-in-progress: false
jobs:
  shadow:
    if: github.ref == 'refs/heads/feature/v11-1-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_DISABLE_TELEGRAM: '1'
      BOT_DATA_MODE: shadow
      TELEGRAM_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      V11_RULES_VALIDATED: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline regression and shadow safety tests
        run: |
          mkdir -p shadow-output
          if python scripts/test_offline.py > shadow-output/offline-tests.log 2>&1; then
            result=0
          else
            result=$?
          fi
          tail -n 100 shadow-output/offline-tests.log
          exit "$result"
      - name: Validate morning artifact provenance
        if: inputs.phase == 'evening'
        id: morning
        uses: actions/github-script@v7
        env:
          MORNING_RUN_ID: ${{ inputs.morning_run_id }}
        with:
          script: |
            let raw = process.env.MORNING_RUN_ID || '';
            let dedicated = false;
            if (!raw) {
              const {data: listing} = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, branch: 'feature/v11-1-review', event: 'workflow_dispatch',
                status: 'success', head_sha: context.sha, per_page: 100
              });
              const candidates = listing.workflow_runs.filter(r =>
                String(r.id) !== String(context.runId) && r.head_sha === context.sha &&
                ['.github/workflows/run.yml','.github/workflows/v11-1-shadow-test.yml'].includes(r.path));
              for (const candidate of candidates) {
                const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: candidate.id});
                const name = `v111-morning-${candidate.id}-${candidate.run_attempt}`;
                if (data.artifacts.some(a => a.name === name && !a.expired)) {
                  raw = String(candidate.id); dedicated = true; break;
                }
              }
              if (!raw) throw new Error('No successful morning checkpoint found on this commit. Run morning first.');
            }
            if (!/^[0-9]+$/.test(raw)) throw new Error('A numeric morning run ID is required');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: raw});
            if (run.head_branch !== 'feature/v11-1-review' || run.head_sha !== context.sha ||
                run.event !== 'workflow_dispatch' || run.conclusion !== 'success' ||
                !['.github/workflows/v11-1-shadow-test.yml','.github/workflows/run.yml'].includes(run.path) || String(run.id) === String(context.runId)) {
              throw new Error('Morning run must be a successful independent run of this workflow on the same branch and commit');
            }
            core.setOutput('artifact', dedicated ? `v111-morning-${run.id}-${run.run_attempt}` : `v11-1-shadow-${run.id}-${run.run_attempt}`);
            core.setOutput('run_id', String(run.id));
      - name: Restore only the public morning checkpoint
        if: inputs.phase == 'evening'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.morning.outputs.artifact }}
          run-id: ${{ steps.morning.outputs.run_id }}
          github-token: ${{ github.token }}
          path: shadow-output/reference
      - name: Live shadow previews and source availability
        env:
          SHADOW_PHASE: ${{ inputs.phase || 'preview' }}
          GROQ_API_KEY: ${{ inputs.use_groq && secrets.GROQ_API_KEY || '' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        run: |
          args=(--phase "$SHADOW_PHASE")
          if [ "$SHADOW_PHASE" = 'evening' ]; then
            args+=(--checkpoint shadow-output/reference/checkpoints/morning.json)
          fi
          if [ '${{ inputs.use_groq }}' = 'true' ]; then
            args+=(--use-groq)
          fi
          python scripts/v111_shadow.py "${args[@]}"
      - name: Validate and stage public artifacts only
        if: always()
        env:
          GROQ_API_KEY: ${{ inputs.use_groq && secrets.GROQ_API_KEY || '' }}
        run: python scripts/stage_shadow_artifacts.py
      - name: Publish discoverable morning checkpoint
        if: success() && inputs.phase == 'morning'
        uses: actions/upload-artifact@v4
        with:
          name: v111-morning-${{ github.run_id }}-${{ github.run_attempt }}
          path: shadow-public-artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Publish isolated shadow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-1-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: shadow-public-artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Summary
        if: always()
        run: |
          echo '## V11.1 Shadow Test' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download v11-1-shadow artifacts: morning.txt, evening.txt, source_availability.json, summary.json.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f shadow-public-artifacts/summary.json ]; then
            cat shadow-public-artifacts/summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f shadow-public-artifacts/comparison.txt ]; then
            cat shadow-public-artifacts/comparison.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'No production state, portfolio, Telegram or trading. Preview uses one snapshot; morning/evening requires a validated independent morning artifact.' >> "$GITHUB_STEP_SUMMARY"
