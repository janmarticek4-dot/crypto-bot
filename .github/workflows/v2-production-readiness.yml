name: V2 Production Readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - v11/event_lifecycle.py
      - v11/prediction_runtime.py
      - v11/integrated_report.py
      - v11/telegram_text.py
      - scripts/v2_context.py
      - scripts/v2_production_preview.py
      - tests/test_production_v2.py
      - .github/workflows/v2-production-readiness.yml
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_DISABLE_TELEGRAM: '1'
      TELEGRAM_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      GROQ_API_KEY: ''
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-research.txt
      - run: python scripts/test_integration_offline.py
      - run: python scripts/v2_production_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: production-v2-readiness-${{ github.run_id }}
          path: shadow-output/production-v2/
          retention-days: 14
