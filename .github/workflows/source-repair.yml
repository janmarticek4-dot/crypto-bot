name: Fundamental Source Repair Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/source_repair_probe.py', '.github/workflows/source-repair.yml']
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_DISABLE_TELEGRAM: '1'
      TELEGRAM_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      GROQ_API_KEY: ''
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/source_repair_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fundamental-source-repair-${{ github.run_id }}
          path: shadow-output/source-repair/
          retention-days: 14
